  - version: 2.3.0
    date: '2026-08-14'
    product: CodeFusion Studio
    source_tag: V2.3.0
    breaking: false
    highlights:
      - >-
        Model Zoo for discovering and deploying AI models, expanding
        AI-assisted embedded development.
      - >-
        Documentation-backed AI assistant skills (cfs-docs, cfs-cli) answering
        product questions directly in the editor — see skills/.
      - >-
        Zephelin profiling now captures traces over USB as well as UART, for
        deeper insight into AI inference performance on hardware.
      - Graphical Package Manager for browsing, filtering and installing packages.
      - >-
        Expanded workspace template library across MAX32655, MAX32657,
        MAX32658, MAX32666, MAX32672, MAX32690 and MAX78000 processors
        (MSDK and Zephyr single-core templates for AES, Coremark, CRC, CTB AES,
        ECC, Flash, GPIO, Hash, RTC Backup, SPI, ADC Devicetree, Eventfd,
        Hello World User, LVGL Basic and UART Async API).
      - >-
        Usability improvements across the Workspace Creation Wizard, System
        Planner and debug tools.
