      docs: https://analogdevicesinc.github.io/libiio/main/
      note: >-
        The documentation site publishes a v1.0 API reference and a "Libiio 0.x
        to 1.x API update guide", but the newest tagged GitHub release is still
        v0.26 from 2024-09-25. The 1.x API is documented ahead of any release
