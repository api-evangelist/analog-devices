apis:
  - aid: analog-devices:libiio-api
    name: Analog Devices libiio API
    description: The libiio library provides a cross-platform C API for interfacing with Linux Industrial I/O (IIO) devices including ADCs, DACs, and RF transceivers. It supports local and remote device
      access via a network daemon, enabling developers to control ADI hardware from Linux and other host platforms.
    tags:
    - Embedded Systems
    - Hardware Interface
    - IIO
    - Linux
    - Signal Processing
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://github.com/analogdevicesinc/libiio
    humanURL: https://analogdevicesinc.github.io/libiio/
    properties:
    - url: https://analogdevicesinc.github.io/libiio/
      type: Documentation
    - url: https://github.com/analogdevicesinc/libiio
      type: GitHubRepository
  - aid: analog-devices:pyadi-iio-api
    name: Analog Devices PyADI-IIO Python API
    description: PyADI-IIO provides Python interfaces for ADI hardware with IIO drivers, enabling Python developers to interact with ADI evaluation boards and production hardware. It abstracts libiio 
      with device-specific high-level interfaces for transceivers, converters, and sensors.
    tags:
    - ADC
    - Embedded Systems
    - Hardware
    - Python
    - RF
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://github.com/analogdevicesinc/pyadi-iio
