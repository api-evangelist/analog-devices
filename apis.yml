      type: GitHubRepository
    - url: https://pypi.org/project/pyadi-iio/
      type: SDKs
  - aid: analog-devices:codefusion-studio
    name: Analog Devices CodeFusion Studio
    description: CodeFusion Studio is ADI's embedded software development environment built on Visual Studio Code for ADI microcontrollers and DSPs. It provides graphical system configuration, code 
      generation, debugging, and security APIs for the ADI Assure Trusted Edge Security Architecture. Initially supports MAX32690 and ADSP-SC5xx processor families.
    tags:
    - Embedded Development
    - IDE
    - Microcontrollers
    - Security
    - VS Code
