  - aid: analog-devices:aditof-sdk
    name: Analog Devices 3D Time-of-Flight SDK
    description: The ADI 3D Time-of-Flight SDK (libaditof, and the ADCAM application layer built on
      it) drives ADI depth cameras from a host. Its network connection is defined by a published
      proto3 contract, in which a host client sends a ClientRequest to the server running on the
      camera and receives a ServerResponse carrying imager, sensor-mode, driver-configuration and
      firmware-version payloads plus a Status enum. It is the only machine-readable network contract
      Analog Devices publishes.
    tags:
    - 3D Imaging
    - Depth Sensing
    - Embedded Systems
    - Protobuf
    - Time of Flight
