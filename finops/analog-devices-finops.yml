specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Analog Devices
providerId: analog-devices
publisherName: Analog Devices, Inc.
serviceCategory: Semiconductors
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Semiconductors
  - Embedded Systems
  - Open Source
description: >-
  FOCUS-aligned FinOps for Analog Devices. ADI's developer software (libiio,
  pyadi-iio, no-OS, CodeFusion Studio) is free open-source; spend on ADI flows
  as bill-of-material direct cost for silicon and evaluation hardware,
  invoiced via distributors or direct sales, not as API consumption.
notes: >-
  No SaaS metered API. The "billing model" reflects hardware procurement, not
  API metering.
sources:
  - https://www.analog.com
  - https://github.com/analogdevicesinc
billingModel:
  pricingCategory: Hardware Purchase
  billingFrequency: Per-Invoice
  billingCurrency: USD
  chargeCategories:
    - Purchase
focusColumns:
  ServiceName: Analog Devices
  ServiceCategory: Semiconductors
  ProviderName: Analog Devices
  PublisherName: Analog Devices, Inc.
  InvoiceIssuerName: Analog Devices, Inc. (or distributor of record)
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: silicon_units_purchased
    description: Count of ADI integrated circuits ordered
    unit: unit
    aggregation: sum
    dimensions:
      - part_number
      - distributor
      - program
  - name: evaluation_boards_purchased
    description: Evaluation / development hardware purchases
    unit: unit
    aggregation: sum
    dimensions:
      - board_family
      - distributor
  - name: sdk_downloads
    description: Open-source SDK downloads (free; tracked for adoption only)
    unit: download
    aggregation: count
    dimensions:
      - package
principles:
  - name: Visibility
    description: >-
      Track ADI spend through ERP / procurement systems and distributor
      portals; SDK adoption can be tracked through GitHub release downloads
      and EngineerZone forum activity.
  - name: Allocation
    description: >-
      Allocate ADI silicon costs to BOMs and product lines; SDK use carries no
      direct cost so no allocation tag is needed.
  - name: Optimization
    description: >-
      Optimization levers are part consolidation across BOMs, multi-source
      qualification, and volume agreements with ADI / distributors. SDK use is
      free.
  - name: Accountability
    description: >-
      Procurement and hardware engineering own the cost; software / firmware
      teams own the open-source SDK consumption (no chargeback).
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
