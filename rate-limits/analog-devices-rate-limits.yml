specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Analog Devices
providerId: analog-devices
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - Embedded Systems
  - Hardware
  - Rate Limiting
description: >-
  Analog Devices' SDKs (libiio, pyadi-iio, no-OS) are local / on-device
  libraries. They do not impose request-per-second throttling; throughput is
  bounded by the underlying transport (USB, Ethernet via iiod, SPI, I2C) and
  by the silicon's sample rate, not by a vendor rate-limit policy. There is no
  central HTTP rate-limit doc to reconcile because there is no central HTTP
  API.
notes: >-
  Limits are bus / silicon bound and per-device, documented in each part's
  datasheet rather than a network rate-limit page.
sources:
  - https://wiki.analog.com/resources/tools-software/linux-software/libiio
  - https://github.com/analogdevicesinc/libiio
responseCodes: {}
limits:
  - name: Per-Device Sample Rate
    scope: device
    metric: varies
    limit: 'see part datasheet (sample rate / bus speed)'
  - name: iiod Network Daemon Throughput
    scope: device
    metric: varies
    limit: 'bounded by network transport (TCP/USB) and device sample rate'
policies:
  - name: Local SDK
    description: >-
      libiio is a local library; rate limiting is not applicable in the SaaS
      sense. Performance characteristics are documented per ADI part.
  - name: Network Daemon (iiod)
    description: >-
      When using iiod for remote access, throughput is bounded by transport
      latency and device sample rate, not by an API rate-limit policy.
maintainers:
  - FN: API Evangelist
    email: info@apievangelist.com
