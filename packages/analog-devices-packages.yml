description: >-
  Analog Devices distributes its developer software as open-source embedded
  libraries and desktop tooling rather than as hosted-API client SDKs. The
  first-party distribution channels are PyPI (Python bindings for the IIO and
  JESD tooling), the Visual Studio Marketplace (the CodeFusion Studio IDE
  extension), and GitHub Releases (libiio, no-OS, Scopy, CodeFusion Studio).
  There is no npm, crates.io, Maven Central, NuGet, RubyGems or Packagist
  package published by Analog Devices that this pass could find.
